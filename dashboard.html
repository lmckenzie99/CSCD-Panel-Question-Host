<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event day — CSCD Panel</title>
    <link rel="stylesheet" href="css/style.css?v=2" />
    <style>
      /* Keep nav buttons self-contained so a stale cached style.css still works on cPanel. */
      .dash-nav {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .dash-nav a {
        display: block;
        text-decoration: none;
        background: var(--navy, #1f3d5c);
        color: #fff;
        border-radius: 6px;
        padding: 0.85rem 1.15rem;
      }
      .dash-nav a:hover {
        background: var(--navy-hover, #163049);
      }
      .dash-nav a:focus-visible {
        outline: 2px solid var(--navy, #1f3d5c);
        outline-offset: 2px;
      }
      .dash-nav .dash-label {
        display: block;
        font-weight: 650;
      }
      .dash-nav .dash-role {
        display: block;
        margin-top: 0.2rem;
        font-size: 0.9rem;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="page-head">
        <span class="kicker">Event day</span>
        <h1>Panel Q&amp;A links</h1>
        <p>Open the right screen for each role. Use this page to set up devices before the panel starts.</p>
      </header>

      <nav class="dash-nav" aria-label="Panel sections">
        <a href="index.html">
          <span class="dash-label">Ask a question</span>
          <span class="dash-role">Students — submit and vote</span>
        </a>
        <a href="wall.html">
          <span class="dash-label">Question wall</span>
          <span class="dash-role">Audience — ranked voting list</span>
        </a>
        <a href="display.html">
          <span class="dash-label">Now reading</span>
          <span class="dash-role">Projector / panelists</span>
        </a>
        <a href="moderator.html">
          <span class="dash-label">Moderator</span>
          <span class="dash-role">Queue, share, and dismiss</span>
        </a>
      </nav>
    </main>
  </body>
</html>
